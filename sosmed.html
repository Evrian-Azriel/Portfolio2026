<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Portfolio - Creative Designer</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="sosmed.css">
</head>
<body>

    <header class="container">
        <nav class="navbar">
            <div class="logo">
                <img src="assets/logo.png" alt="Logo">
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="back-btn">← Back</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="hero-section">
            <h1 class="page-title">Social Media.</h1>
        </section>

        <!-- Category: Travel -->
        <section class="category">
            <div class="category-header">
                <span class="category-name">TRAVEL</span>
            </div>
            <div class="gallery-grid travel-grid">
                <div class="grid-item">
                    <img src="assets/travel-1.jpg" alt="Travel Work 1">
                </div>
                <div class="grid-item">
                    <img src="assets/travel-2.jpg" alt="Travel Work 2">
                </div>
                <div class="grid-item">
                    <img src="assets/travel-3.jpg" alt="Travel Work 3">
                </div>
                <div class="grid-item">
                    <img src="assets/travel-4.jpg" alt="Travel Work 4">
                </div>
                <div class="grid-item mobile-mockup">
                    <img src="assets/travel-phone.png" alt="Travel Phone Mockup">
                </div>
            </div>
        </section>

        <!-- Category: Skincare -->
        <section class="category">
            <div class="category-header">
                <span class="category-name">SKINCARE</span>
            </div>
            <div class="gallery-grid skincare-grid">
                <div class="grid-item mobile-mockup">
                    <img src="assets/skincare-phone.png" alt="Skincare Phone Mockup">
                </div>
                <div class="grid-item">
                    <img src="assets/skincare-1.jpg" alt="Skincare Work 1">
                </div>
                <div class="grid-item">
                    <img src="assets/skincare-2.jpg" alt="Skincare Work 2">
                </div>
                <div class="grid-item">
                    <img src="assets/skincare-3.jpg" alt="Skincare Work 3">
                </div>
                <div class="grid-item">
                    <img src="assets/skincare-4.jpg" alt="Skincare Work 4">
                </div>
            </div>
        </section>

        <!-- Category: Food & Beverage -->
        <section class="category">
            <div class="category-header">
                <span class="category-name">Food & Beverage</span>
            </div>
            <div class="gallery-grid fnb-grid">
                <!-- Baris Atas: Story di kiri, Post di kanan -->
                <div class="grid-item fnb-story">
                    <img src="assets/fnb1.png" alt="F&B Story">
                </div>
                <div class="grid-item fnb-post">
                    <img src="assets/fnb2.png" alt="F&B Post">
                </div>
                <!-- Baris Bawah: 3 Sejajar -->
                <div class="grid-item fnb-bottom">
                    <img src="assets/fnb3.png" alt="F&B Work 3">
                </div>
                <div class="grid-item fnb-bottom">
                    <img src="assets/fnb4.png" alt="F&B Work 4">
                </div>
                <div class="grid-item fnb-bottom">
                    <img src="assets/fnb5.png" alt="F&B Work 5">
                </div>
            </div>
        </section>
    </main>

    <footer class="footer container">
        <div class="footer-content">
            <!-- Logo besar di sebelah kiri -->
            <div class="footer-left">
                <img src="assets/logo-large.png" alt="Logo" class="large-footer-logo">
            </div>
            
            <!-- Informasi kontak di sebelah kanan -->
            <div class="footer-right">
                <h2 class="footer-heading">Let’s Bring Your Ideas To Life</h2>
                
                <div class="contact-grid">
                    <div class="contact-item">
                        <span class="contact-label">EMAIL</span>
                        <a href="mailto:evrian.azriel@gmail.com" class="contact-value">evrian.azriel@gmail.com</a>
                    </div>
                    
                    <div class="contact-item">
                        <span class="contact-label">QUICK CONTACT</span>
                        <a href="https://wa.me/628211223562" class="contact-value">Whatsapp</a>
                    </div>
                    
                    <div class="contact-item">
                        <span class="contact-label">SOCIAL MEDIA</span>
                        <div class="social-group">
                            <a href="https://www.instagram.com/evrianazriel/" class="contact-value">Instagram</a>
                            <a href="https://www.linkedin.com/in/evrian-azriel-faisal-a718a0289" class="contact-value">Linkedin</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
